<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monument · India, A Living Museum</title>
  <meta name="theme-color" content="#13203f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="lights" aria-hidden="true"></div>
  <div class="band" aria-hidden="true"></div>
  <div class="wrap">
    <nav class="topbar">
      <a class="back" href="index.html">← All monuments</a>
      <a class="brand" href="index.html">India<small>A Living Museum</small></a>
    </nav>
    <main id="page"></main>
  </div>
  <footer>
    <div class="wrap">A 9th-grade school project · India, A Living Museum</div>
    <div class="skyline" aria-hidden="true"></div>
    <div class="band" aria-hidden="true"></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/image-credits.js"></script>
  <script>
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const page = document.getElementById("page");
    const id = new URLSearchParams(location.search).get("id");
    const i = MONUMENTS.findIndex(m => m.id === id);

    if (i < 0) {
      page.innerHTML = `<p class="empty">Sorry, we couldn't find that monument.<br><a href="index.html">See all monuments</a></p>`;
    } else {
      const m = MONUMENTS[i];
      const img = (typeof IMAGE_CREDITS !== "undefined" && IMAGE_CREDITS[m.id]) || null;
      const prev = MONUMENTS[(i - 1 + MONUMENTS.length) % MONUMENTS.length];
      const next = MONUMENTS[(i + 1) % MONUMENTS.length];
      const isUnesco = m.unesco.startsWith("Yes");
      document.title = `${m.name} · India, A Living Museum`;

      const row = (label, value) => `<div><dt>${label}</dt><dd>${esc(value)}</dd></div>`;

      page.innerHTML = `
        ${img ? `
          <figure class="photo" style="margin-top:0;margin-bottom:0">
            <img src="${esc(img.file)}" alt="${esc(m.name)}" width="960" height="720">
          </figure>
          <p class="credit">Photo: ${esc(img.artist)} ·
            <a href="${esc(img.page)}" target="_blank" rel="noopener">${esc(img.license)}</a>, via Wikimedia Commons</p>` : ""}

        <h1 class="title">${esc(m.name)}</h1>
        <p class="where">
          <span class="badge">${esc(m.state)}${m.region === "Union Territory" ? " (UT)" : ""}</span>
          ${isUnesco ? `<span class="badge unesco">UNESCO World Heritage</span>` : ""}
        </p>

        <section class="panel">
          <h2>🏛️ Fundamental Facts</h2>
          <dl class="facts-table">
            ${row("Location", m.location + ", " + m.state)}
            ${row("Built by", m.builtBy)}
            ${row("When", m.period)}
            ${row("Architectural style", m.style)}
            ${row("UNESCO World Heritage", m.unesco)}
          </dl>
        </section>

        <section class="panel">
          <h2>🪔 Interesting Facts</h2>
          <ol class="fun">${m.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ol>
        </section>

        <nav class="pager" aria-label="More monuments">
          <a href="monument.html?id=${encodeURIComponent(prev.id)}"><small>← Previous</small>${esc(prev.name)}</a>
          <a class="next" href="monument.html?id=${encodeURIComponent(next.id)}"><small>Next →</small>${esc(next.name)}</a>
        </nav>`;
    }
  </script>
</body>
</html>
